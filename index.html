<title>GEELY TAXI</title>
<style>
:root{--ink:#16202b;--amber:#f2a900;--paper:#f5f6f8;--green:#1f7a4d;--red:#c23b2e;--steel:#6b7684;--line:#e3e6ea;--blue:#2e6fb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,"SF Arabic","Geeza Pro",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px solid var(--amber)}
header h1{font-size:18px;margin:0;font-weight:800}
header .sub{font-size:12px;color:#aab4c0}
.iconbtn{background:rgba(255,255,255,.1);border:0;color:#fff;width:42px;height:42px;border-radius:12px;font-size:20px}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;padding:9px 0 7px;font:inherit;font-size:11px;color:var(--steel);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:21px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--ink);font-weight:800}
nav button.on .i{filter:none;opacity:1}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.sec{font-size:14px;font-weight:800;margin:20px 2px 8px}
.muted{color:var(--steel);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat .v{font-size:18px;font-weight:800}
.stat .l{font-size:12px;color:var(--steel);margin-top:2px}
.pos{color:var(--green)}.neg{color:var(--red)}.blue{color:var(--blue)}.amb{color:#9a6b00}
.meter{background:var(--ink);color:#fff;border-radius:16px;padding:16px;margin:10px 0}
.meter .t{font-size:12.5px;color:#aab4c0}
.meter .v{font-size:34px;font-weight:800;color:var(--amber);letter-spacing:.5px;margin:4px 0}
.meter .v.neg{color:#ff7b6b}
.meter .f{font-size:11.5px;color:#8995a3}
.alert{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;margin-bottom:7px;font-size:14px}
.alert.warn{background:#fff3d6;color:#7a5300}.alert.bad{background:#fde6e3;color:#9c2619}.alert.ok{background:#e4f3ea;color:#1a5e3b}
select,input,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #d5d9df;border-radius:11px;background:#fff;color:inherit;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#6b7684 50%),linear-gradient(135deg,#6b7684 50%,transparent 50%);background-position:18px 50%,12px 50%;background-size:6px 6px;background-repeat:no-repeat;padding-left:30px}
input[readonly]{background:#f0f2f5}
label{display:block;font-size:12.5px;color:var(--steel);margin:10px 2px 4px}
.btn{display:block;width:100%;border:0;border-radius:13px;padding:14px;font:inherit;font-weight:800;font-size:16px;background:var(--amber);color:var(--ink);margin-top:12px}
.btn.dark{background:var(--ink);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.red{background:#fff;color:var(--red);border:1px solid #f0c3bd}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row:last-child{border-bottom:0}
.day .dh{display:flex;justify-content:space-between;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.pill{font-size:12px;padding:3px 9px;border-radius:20px;background:#fff3d6;color:#7a5300}
.pill.b{background:#e5eef8;color:#1f4f82}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:13px;color:var(--steel)}
.mini b{color:var(--ink);font-weight:700}
.desc{font-size:12.5px;color:var(--steel);margin-top:6px}
.miss{border:1.5px dashed #e0b44a;background:#fffaf0;color:#7a5300;font-size:14px}
.seg{display:flex;background:#e7eaee;border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font:inherit;font-size:13.5px;color:var(--steel)}
.seg button.on{background:#fff;color:var(--ink);font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tbl{overflow-x:auto;background:#fff;border-radius:12px;border:1px solid var(--line);margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th{background:var(--ink);color:#fff;padding:8px 6px;font-weight:700}
td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
tr.tot td{font-weight:800;background:#fff3d6}
.chart{display:flex;align-items:flex-end;height:170px;gap:4px;direction:ltr;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bars{flex:1;display:flex;align-items:flex-end;gap:2px;width:100%;justify-content:center}
.b{width:42%;border-radius:3px 3px 0 0;min-height:1px}
.bo{background:var(--amber)}.bb{background:var(--blue)}
.x{font-size:9px;color:var(--steel);margin-top:4px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--steel);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:5px;vertical-align:-1px}
.prev{background:var(--ink);color:#fff;border-radius:12px;padding:12px;margin-top:14px}
.prev .row{border-color:rgba(255,255,255,.12)}
.sub2{background:#eef3f9;border-radius:12px;padding:4px 12px 12px;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(10,15,22,.55);z-index:20;display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{background:var(--paper);width:100%;max-width:720px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:18px}
.x2{float:left;background:#e7eaee;border:0;width:34px;height:34px;border-radius:50%;font-size:16px}
#lock{position:fixed;inset:0;background:var(--ink);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.dots{display:flex;gap:14px;margin:18px 0 28px}
.dots span{width:15px;height:15px;border-radius:50%;border:2px solid var(--amber)}
.dots span.f{background:var(--amber)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr}
.pad button{height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:26px;font-family:inherit}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:60;display:none}
.logo{max-width:90px;max-height:60px}
.row.sel{cursor:pointer;margin:0 -8px;padding:10px 8px;border-radius:10px}
.row.sel.on{background:#fff6df}
.ck{display:inline-flex;width:22px;height:22px;border:2px solid #c5cbd3;border-radius:6px;margin-left:10px;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:800;vertical-align:-5px}
.row.sel.on .ck{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.selbar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:3;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;min-height:56px;margin:0 0 10px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
#pw{display:none}

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=s=>{if(!s)return '—';const[a,b,c]=s.split('-');return '<span class="num">'+c+'/'+b+'/'+a+'</span>'};

 rows.forEach((r,i)=>{const off2=r[8]===O;s.days.push({id:uid()+i,date:'2026-09-'+String(i+1).padStart(2,'0'),km:r[0],cons:r[1],price:r[2],fuel:r[3],rec:r[4],exp:r[5],expDesc:r[6],d1:M,s1:r[7],w1:R[r[7]],ded1:0,d2:off2?'':H,s2:off2?'':r[8],w2:off2?0:R[r[8]],ded2:0,exp2:0})});
 s.losses=[{id:uid()+'a',date:'2026-09-03',desc:'habib taxi',amount:3400,type:'أخرى'},{id:uid()+'b',date:'2026-09-11',desc:'Huil 10w40 liquimoly vert',amount:375,type:'فيدانج'},{id:uid()+'c',date:'2026-09-11',desc:"Filter air + la main-d'œuvre",amount:90,type:'قطع غيار'},{id:uid()+'d',date:'2026-09-12',desc:'Abderahmane motor',amount:0,type:'إصلاح'}];

function idbOpen(cb){try{const r=indexedDB.open('geely_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>cb(r.result);r.onerror=()=>cb(null)}catch(e){cb(null)}}
function save(){S._ts=Date.now();const str=JSON.stringify(S);try{localStorage.setItem(KEY,str)}catch(e){try{localStorage.removeItem(KEY)}catch(e2){}}idbOpen(db=>{if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put(str,'state')}catch(e){}})}
function boot(){const fromLS=()=>{let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}if(raw){try{return norm(JSON.parse(raw))}catch(e){}}return null};
 const fin=o=>{const b=fromLS();S=(o&&(!b||(o._ts||0)>=(b._ts||0)))?o:(b||o||defaults());save();start()};
 idbOpen(db=>{if(!db)return fin(null);try{const g=db.transaction('kv').objectStore('kv').get('state');g.onsuccess=()=>{let o=null;try{o=g.result?norm(JSON.parse(g.result)):null}catch(e){}fin(o)};g.onerror=()=>fin(null)}catch(e){fin(null)}});
}
function start(){const now=new Date();UI.period='m:'+ymOf(todayIso());const last=lastDay();UI.dm=last&&ymOf(last.date)!==ymOf(todayIso())&&!S.days.some(d=>ymOf(d.date)===ymOf(todayIso()))?ymOf(todayIso()):ymOf(todayIso());UI.rm=ymOf(todayIso());UI.ry=String(now.getFullYear());UI.lm='all';render();lock()}
// ---------- calculations ----------
const shiftRate=n=>{const s=S.settings.shifts.find(x=>x.n===n);return s?+s.r:0};
function calc(d){const w1=Math.max(0,num(d.w1)-num(d.ded1)),w2=d.d2?Math.max(0,num(d.w2)-num(d.ded2)):0;return{w1,w2,ros:w1+w2,baqi:num(d.rec)-num(d.fuel)-num(d.exp)-w1,expT:num(d.exp)+num(d.exp2)}}
function lastDay(){return S.days.slice().sort((a,b)=>a.date.localeCompare(b.date)).pop()}
function firstDate(){return S.days.reduce((m,d)=>!m||d.date<m?d.date:m,'')}
function monthsRange(){let first=ymOf(todayIso()),last=first;[...S.days,...S.losses].forEach(x=>{if(!x.date)return;const m=ymOf(x.date);if(m<first)first=m;if(m>last)last=m});const out=[];let m=first;while(m<=last){out.push(m);m=nextYm(m)}return out}
function instFor(m){const M=S.maint;if(!M.instStart||!(num(M.instCount)>0)||!(num(M.instAmt)>0))return 0;const s=ymOf(M.instStart);let e=s;for(let i=1;i<num(M.instCount);i++)e=nextYm(e);return m>=s&&m<=e?num(M.instAmt):0}
function fixedFor(m){return S.fixed.filter(f=>!f.from||f.from<=m).reduce((s,f)=>s+num(f.a),0)+instFor(m)}
function periodMonths(p){const all=monthsRange(),cur=ymOf(todayIso());if(p==='all')return all.filter(m=>m<=cur);if(p.startsWith('y:'))return all.filter(m=>m.startsWith(p.slice(2))&&m<=cur);return[p.slice(2)]}
function agg(ms){const set=new Set(ms),a={ros:0,fuel:0,exp:0,rec:0,km:0,kwh:0,free:0,fkwh:0,save:0,evKm:0,baqi:{},rosBy:{},work:{},loss:0,n:0};
 S.days.forEach(d=>{if(!set.has(ymOf(d.date)))return;const c=calc(d);a.n++;a.ros+=c.ros;a.fuel+=num(d.fuel);a.exp+=c.expT;a.rec+=num(d.rec);a.km+=num(d.km);if(d.ev){a.kwh+=num(d.kwh)+num(d.fkwh);if(d.free){a.free++;a.fkwh+=num(d.fkwh)}a.save+=num(d.dieselEq)-num(d.fuel);a.evKm+=num(d.km)}
  if(d.d1){a.baqi[d.d1]=(a.baqi[d.d1]||0)+c.baqi;a.rosBy[d.d1]=(a.rosBy[d.d1]||0)+c.w1;if(isWork(d.s1))a.work[d.d1]=(a.work[d.d1]||0)+1}
  if(d.d2){a.rosBy[d.d2]=(a.rosBy[d.d2]||0)+c.w2;if(isWork(d.s2))a.work[d.d2]=(a.work[d.d2]||0)+1}});
 a.loss=S.losses.filter(l=>l.date&&set.has(ymOf(l.date))).reduce((s,l)=>s+num(l.amount),0);
 const cur=ymOf(todayIso());a.fixed=ms.filter(m=>m<=cur).reduce((s,m)=>s+fixedFor(m),0);a.net=a.ros-a.loss;
 a.baqiT=Object.values(a.baqi).reduce((s,v)=>s+v,0);return a}
const aggP=p=>agg(periodMonths(p));
function driverNames(a){const n=[...S.settings.drivers];if(a)Object.keys(a.rosBy).forEach(k=>{if(!n.includes(k))n.push(k)});return n}
function instInfo(){const M=S.maint,c=num(M.instCount);if(!M.instStart||!(c>0))return null;const s=pd(M.instStart),t=new Date();t.setHours(0,0,0,0);let paid=0,next='';for(let i=0;i<c;i++){const d=new Date(s.getFullYear(),s.getMonth()+i,s.getDate());if(d<=t)paid++;else if(!next)next=iso(d)}return{paid,count:c,rest:(c-paid)*num(M.instAmt),next,end:iso(new Date(s.getFullYear(),s.getMonth()+c-1,s.getDate()))}}
function missingDays(){const f=firstDate();if(!f)return[];const out=[],t=new Date();for(let i=3;i>=1;i--){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-i),s=iso(d);if(s>=f&&!S.days.some(x=>x.date===s))out.push(s)}return out}

function alertsList(){const M=S.maint,L=[];
 const ins=daysUntil(M.ins);if(ins!==null){if(ins<0)L.push(['bad','🛡️','التأمين سالا هادي '+(-ins)+' يوم ('+fd(M.ins)+')',"go('maint')"]);else if(ins<=15)L.push([ins<=3?'bad':'warn','🛡️','التأمين غادي يسالي '+whenTxt(ins)+' ('+fd(M.ins)+')',"go('maint')"])}
 const vt=daysUntil(M.vt);if(vt!==null){if(vt<0)L.push(['bad','🔍','الفيزيت سالات هادي '+(-vt)+' يوم',"go('maint')"]);else if(vt<=30)L.push([vt<=5?'bad':'warn','🔍','الفيزيت غادي تسالي '+whenTxt(vt)+' ('+fd(M.vt)+')',"go('maint')"])}
 if(!S.ev.on&&num(M.oilLast)>0){const rem=num(M.oilLast)+num(M.oilEvery)-num(M.km);if(rem<=0)L.push(['bad','🛢️','الفيدانج فات بـ '+km(-rem),"go('maint')"]);else if(rem<=1000)L.push(['warn','🛢️','باقي '+km(rem)+' للفيدانج',"go('maint')"])}
 const ii=instInfo();if(ii&&ii.next&&num(M.instAmt)>0){const n=daysUntil(ii.next);if(n<=5)L.push(['warn','💳','القسط ديال '+money(M.instAmt)+' '+whenTxt(n),"go('maint')"])}
 const t0=new Date();t0.setDate(t0.getDate()-7);S.days.filter(d=>pd(d.date)>=t0&&fuelOdd(d)).forEach(d=>{const md=consMed(!!d.ev);L.push(['warn',d.ev?'⚡':'⛽',(d.ev?'الكهرباء':'المازوط')+' غريب نهار '+fd(d.date)+': <span class="num">'+num(d.cons).toFixed(2)+'</span> '+(d.ev?'kWh':'L')+'/100 (العادة <span class="num">'+md.toFixed(2)+'</span>)',`openDay('${d.id}')`])});

 const ab=advBal();Object.keys(ab).forEach(n=>{if(ab[n]>0)L.push(['warn','💵',esc(n)+' عليه '+money(ab[n])+' سلف',"UI.lt='a';go('loss')"])});
 {const br=batRows(),b0=br[0]&&br[0].c,bl=br[br.length-1];if(br.length>1&&b0&&bl.c&&bl.k>2000){const df=(bl.c-b0)/b0*100;if(df>=15)L.push(['bad','🔋','الباطري كتستهلك '+df.toFixed(1)+'% أكثر من العام الأول — شوف الضمان',"UI.rt='a';go('rep')"]);else if(df>=5)L.push(['warn','🔋','الباطري كتستهلك '+df.toFixed(1)+'% أكثر من العام الأول',"UI.rt='a';go('rep')"])}}

function lossRow(l){return `<div class="row" onclick="openLoss('${l.id}')"><span><b>${esc(l.desc)||'—'}</b> ${l.photo?'📷':''}<br><span class="muted">${fd(l.date)} · ${esc(l.type||'أخرى')}${l.km?' · '+km(l.km):''}</span></span><b class="neg">${money(l.amount)}</b></div>`}
function vLossList(){const f=UI.lm,ls=S.losses.filter(l=>f==='all'||ymOf(l.date||'')===f).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),t=ls.reduce((s,l)=>s+num(l.amount),0);
 return `<select onchange="UI.lm=this.value;render()"><option value="all">كل الخسائر</option>${monthOpts(f)}</select>
 <div class="meter"><div class="t">مجموع الخسائر</div><div class="v">${money(t)}</div><div class="f">${ls.length} عملية</div></div>
 <button class="btn" onclick="openLoss()">＋ زيد خسارة / إصلاح</button><div style="height:10px"></div>
 <div class="card">${ls.length?ls.map(lossRow).join(''):'<div class="muted">ماكاين حتى خسارة هنا.</div>'}</div>`}
function vRepairs(){const cur=num(S.maint.km),rs=S.losses.filter(l=>REPT.includes(l.type)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),last={};rs.forEach(l=>{if(!last[l.type])last[l.type]=l});
 const tot=rs.reduce((s,l)=>s+num(l.amount),0);
 let h=`<div class="meter"><div class="t">مجموع الإصلاحات والقطع</div><div class="v">${money(tot)}</div><div class="f">الكونتور دابا: ${Math.round(cur).toLocaleString('en-US')} كم</div></div>`;
 h+=`<div class="sec">🕓 آخر مرة</div><div class="card">${Object.keys(last).length?Object.values(last).map(l=>`<div class="row"><span><b>${esc(l.type)}</b><br><span class="muted">${esc(l.desc)}</span></span><span style="text-align:left">${fd(l.date)}<br><span class="muted">${l.km?'هادي '+km(cur-num(l.km)):''}</span></span></div>`).join(''):'<div class="muted">ملي تزيد خسارة، ختار النوع (إصلاح، فيدانج، قطع غيار…) ودخل الكونتور، وغادي تبان هنا.</div>'}</div>`;
 h+=`<button class="btn" onclick="openLoss(null,'إصلاح')">＋ زيد إصلاح</button><div class="sec">📋 كل الإصلاحات</div><div class="card">${rs.length?rs.map(lossRow).join(''):'<div class="muted">والو.</div>'}</div>`;
 return h}
function openLoss(id,type){const l=id?S.losses.find(x=>x.id===id):{date:todayIso(),desc:'',amount:'',type:type||'أخرى',km:Math.round(num(S.maint.km))||'',photo:''};UI.lphoto=l.photo||'';
 modal(`<button class="x2" onclick="closeModal()">✕</button><h2>${id?'تعديل':'خسارة / إصلاح جديد'}</h2>
 <div class="grid2"><div><label>النوع</label><select id="l_type">${optList(LTYPES,l.type||'أخرى')}</select></div><div><label>التاريخ</label><input type="date" id="l_date" value="${l.date}"></div></div>
 <label>البيان</label><input id="l_desc" value="${esc(l.desc)}" placeholder="مثلا: زيت، فيلتر، فرانات، ميكانيسيان…">
 <div class="grid2"><div><label>المبلغ (DH)</label><input id="l_amt" inputmode="decimal" value="${l.amount===''?'':l.amount}"></div><div><label>الكونتور (كم)</label><input id="l_km" inputmode="numeric" value="${l.km||''}"></div></div>
 <label>📷 تصويرة الفاكتورة</label><div id="l_ph">${phHtml()}</div><input type="file" accept="image/*" onchange="setLPhoto(this)">
 <button class="btn" onclick="saveLoss('${id||''}')">حفظ</button>${id?`<button class="btn red" onclick="delLoss('${id}')">مسح</button>`:''}`)}
function phHtml(){return UI.lphoto?`<img src="${UI.lphoto}" style="max-width:100%;max-height:260px;border-radius:10px;display:block;margin-bottom:6px" onclick="viewPhoto(UI.lphoto)"><button class="btn sm red" style="margin-bottom:8px" onclick="UI.lphoto='';$('#l_ph').innerHTML=phHtml()">مسح التصويرة</button>`:''}
function resizeImg(f,max,q,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(f)}
function setLPhoto(inp){resizeImg(inp.files[0],1000,0.6,u=>{UI.lphoto=u;$('#l_ph').innerHTML=phHtml()})}
function viewPhoto(u){const w=$('#pv');w.innerHTML=`<img src="${u}">`;w.style.display='flex'}
function saveLoss(id){const o={date:$('#l_date').value,desc:$('#l_desc').value.trim(),amount:num($('#l_amt').value),type:$('#l_type').value,km:num($('#l_km').value)||'',photo:UI.lphoto||''};if(!o.date)return alert('ختار التاريخ');
 if(id)Object.assign(S.losses.find(x=>x.id===id),o);else S.losses.push({id:uid(),...o});
 if(o.type==='فيدانج'&&o.km&&o.km>num(S.maint.oilLast)&&confirm('نسجلو هاد الكونتور ('+o.km+' كم) كآخر فيدانج فالصيانة؟')){S.maint.oilLast=o.km;S.maint.oilDate=o.date}

function advBal(){const b={};S.advances.forEach(a=>{b[a.driver]=(b[a.driver]||0)+(a.kind==='out'?num(a.amount):-num(a.amount))});return b}
function vAdv(){const b=advBal(),names=[...new Set([...S.settings.drivers,...Object.keys(b)])],tot=Object.values(b).reduce((s,v)=>s+Math.max(0,v),0),ls=S.advances.slice().sort((x,y)=>(y.date||'').localeCompare(x.date||''));
 return `<div class="meter"><div class="t">💵 السلف لي باقي عند السائقين</div><div class="v">${money(tot)}</div></div>
 <div class="grid2">${names.map(n=>{const v=b[n]||0;return `<div class="stat"><div class="v ${v>0?'neg':v<0?'blue':'pos'}">${money(Math.abs(v))}</div><div class="l">${esc(n)} — ${v>0?'عليه':v<0?'ليه (زايد)':'خالص ✅'}</div></div>`}).join('')}</div>
 <div class="grid2"><button class="btn" onclick="openAdv(null,'out')">＋ عطيت سلف</button><button class="btn dark" onclick="openAdv(null,'in')">＋ رجع ليا</button></div>

function openAdv(id,kind){const a=id?S.advances.find(x=>x.id===id):{date:todayIso(),driver:S.settings.drivers[0]||'',kind:kind||'out',amount:'',note:''};

function saveAdv(id){const o={kind:$('#a_kind').value,date:$('#a_date').value,driver:$('#a_drv').value,amount:num($('#a_amt').value),note:$('#a_note').value.trim()};if(!o.date||!o.driver||!o.amount)return alert('عمر التاريخ والسائق والمبلغ');if(id)Object.assign(S.advances.find(x=>x.id===id),o);else S.advances.push({id:uid(),...o});save();closeModal();toast('تحفظ ✅');render()}
function delAdv(id){if(!confirm('نمسحو هادي؟'))return;S.advances=S.advances.filter(x=>x.id!==id);save();closeModal();render()}
// ---------- fuel check ----------
function consMed(ev){const xs=S.days.filter(d=>!!d.ev===!!ev&&num(d.km)>20&&num(d.cons)>0).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(d=>num(d.cons)).sort((a,b)=>a-b);if(xs.length<5)return 0;const m=Math.floor(xs.length/2);return xs.length%2?xs[m]:(xs[m-1]+xs[m])/2}
function fuelOdd(d,med){med=consMed(!!d.ev);return med>0&&num(d.km)>20&&num(d.cons)>med*1.25}

const isEvDate=dt=>!!(S.ev.on&&S.ev.from&&dt>=S.ev.from);
function enBlock(v){if(!isEvDate(v.date)){return `<div class="grid3"><div><label>استهلاك L/100</label><input id="f_cons" inputmode="decimal" value="${v.ev?S.settings.cons:esc(v.cons)}" oninput="dayRecalc('f_cons')"></div><div><label>ثمن اللتر</label><input id="f_price" inputmode="decimal" value="${v.ev?S.settings.price:esc(v.price)}" oninput="dayRecalc('f_price')"></div><div><label>تكلفة المازوط</label><input id="f_fuel" inputmode="decimal" value="${v.ev?0:esc(v.fuel)}" oninput="dayRecalc('f_fuel')"></div></div>`}
 const lastEv=S.days.filter(d=>d.ev).sort((a,b)=>a.date.localeCompare(b.date)).pop();UI.cm=v.ev?(v.cmode||'home'):(lastEv?lastEv.cmode||'home':'home');
 const val=(k,dflt)=>v.ev?(v[k]===''||v[k]===undefined?dflt:v[k]):dflt,x=(i,l,val,ro)=>`<div><label>${l}</label><input id="${i}" inputmode="decimal" value="${val===''?'':esc(val)}" ${ro?'readonly':''} oninput="dayRecalc('${i}')"></div>`;
 return `<div class="sub2" style="background:#e6f5ec;margin-top:10px"><label style="font-weight:800;color:var(--ink)">⚡ الشحن ديال اليوم</label>
 <div class="seg" id="f_cm">${[['home','🏠 الدار'],['borne','🔌 البورن'],['none','بلا شحن']].map(m=>`<button type="button" data-m="${m[0]}" class="${UI.cm===m[0]?'on':''}" onclick="setCm('${m[0]}')">${m[1]}</button>`).join('')}</div>
 <div class="grid2" id="f_homeRow">${x('f_pb','% الباطري قبل الشحن',val('pb',''))}${x('f_pa','% الباطري بعد الشحن',val('pa',''))}</div>
 <div class="grid3">${x('f_kwh','kWh',val('kwh',''))}${x('f_tar','ثمن kWh',val('price',S.ev.tariff))}${x('f_fuel','تكلفة الكهرباء',val('fuel',''))}</div>
 <label style="display:flex;gap:10px;align-items:center;margin:12px 2px 0;color:var(--ink);font-weight:700;font-size:14.5px"><input type="checkbox" id="f_free" style="-webkit-appearance:checkbox;appearance:auto;width:22px;height:22px;padding:0;flex:none" ${v.ev&&v.free?'checked':''} onchange="evRecalc('f_free')">🎁 شارجيت فابور (شحن سريع ولا عند شي حد)</label>
 <div class="grid3" id="f_freeRow">${x('f_fpb','% قبل',val('fpb',''))}${x('f_fpa','% بعد',val('fpa',''))}${x('f_fkwh','kWh فابور',val('fkwh',''))}</div>
 <div class="muted" id="f_freeHint" style="margin-top:4px">دخل % قبل وبعد، ولا kWh إلا بان ليك فالشارجور.</div></div>`}
function setCm(m){UI.cm=m;document.querySelectorAll('#f_cm button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));evRecalc('mode')}
function dateChanged(){const dt=$('#f_date').value,isEv=!!$('#f_pb');if(isEvDate(dt)!==isEv){$('#f_en').innerHTML=enBlock({date:dt,cons:S.settings.cons,price:S.settings.price,fuel:''});dayRecalc()}}
function evRecalc(src){const g=i=>num($('#'+i).value),m=UI.cm;$('#f_homeRow').style.display=m==='home'?'grid':'none';$('#f_kwh').readOnly=m!=='borne';
 if(m==='none'){$('#f_kwh').value=0;$('#f_fuel').value=0}
 else{if(m==='home'&&['f_pb','f_pa','mode'].includes(src))$('#f_kwh').value=r2(Math.max(0,g('f_pa')-g('f_pb'))/100*num(S.ev.battery));if(['f_pb','f_pa','f_kwh','f_tar','mode'].includes(src))$('#f_fuel').value=r2(g('f_kwh')*g('f_tar'))}
 const fr=$('#f_free').checked;$('#f_freeRow').style.display=fr?'grid':'none';$('#f_freeHint').style.display=fr?'block':'none';
 if(fr&&src!=='f_fkwh'&&g('f_fpa')>g('f_fpb'))$('#f_fkwh').value=r2((g('f_fpa')-g('f_fpb'))/100*num(S.ev.battery));
 const fk=fr?g('f_fkwh'):0,kmv=g('f_km'),kwh=g('f_kwh')+fk,eq=kmv*num(S.ev.refCons)/100*num(S.ev.refPrice),cons=kmv?kwh/kmv*100:0,md=consMed(true),cw=md>0&&kmv>20&&cons>md*1.25;
 const d={rec:g('f_rec'),fuel:g('f_fuel'),exp:g('f_exp'),w1:g('f_w1'),ded1:g('f_ded1'),d2:$('#f_d2').value,w2:g('f_w2'),ded2:g('f_ded2')},c=calc(d);
 $('#f_prev').innerHTML=(cw?`<div class="alert bad" style="margin:0 0 8px">⚡ الاستهلاك عالي: العادة ${md.toFixed(2)} kWh/100</div>`:'')+`<div class="row"><span>الباقي للسائق الرئيسي</span><b style="color:${c.baqi<0?'#ff7b6b':'var(--amber)'}">${money(c.baqi)}</b></div><div class="row"><span>مجموع الروسيطات ديالك</span><b>${money(c.ros)}</b></div><div class="row"><span>الاستهلاك</span><b class="num">${cons?cons.toFixed(2):'—'} kWh/100</b></div>${fk?`<div class="row"><span>🎁 كهرباء فابور</span><b><span class="num">${fmtN(fk)} kWh</span> ≈ ${money(fk*num(S.ev.tariff))}</b></div>`:''}<div class="row"><span>لو كان ديزل كون خلصتي</span><b>${money(eq)}</b></div><div class="row"><span>⚡ التوفير ديال اليوم</span><b style="color:#7ee2a8">${money(eq-g('f_fuel'))}</b></div>`}
function evTotals(){const a=agg(monthsRange()),net=num(S.ev.price)-num(S.ev.subsidy),months=new Set(S.days.filter(d=>d.ev).map(d=>ymOf(d.date))).size;return{a,net,rest:net-a.save,pct:net?Math.min(100,Math.max(0,a.save/net*100)):0,months,perMonth:months?a.save/months:0}}

 return `<div class="sec">⚡ ${esc(S.ev.model)}</div><div class="meter" style="background:#0f3d2a"><div class="t">التوفير من المازوط فهاد الفترة</div><div class="v" style="color:#7ee2a8">${money(a.save)}</div>
 <div class="f">الكهرباء ${fmtN(a.fuel)} DH · <span class="num">${fmtN(a.kwh)}</span> kWh · ${a.evKm?'<span class="num">'+(a.kwh/a.evKm*100).toFixed(2)+'</span> kWh/100':'—'}${a.free?'<br>🎁 '+a.free+' شحن فابور · <span class="num">'+fmtN(a.fkwh)+'</span> kWh ≈ '+fmtN(a.fkwh*num(S.ev.tariff))+' DH':''}</div></div>
 <div class="card"><div class="row"><span>🎯 نقطة التعادل (${money(T.net)})</span><b>${T.rest>0?'باقي '+money(T.rest):'✅ وصلتي!'}</b></div>

 <div class="muted">مجموع التوفير: ${money(T.a.save)} (<span class="num">${T.pct.toFixed(1)}%</span>)${eta?' · تقريبا '+eta+' شهر باقي':''}</div></div>`}
function generalReport(){const T=evTotals(),a=T.a,eq=S.days.filter(d=>d.ev).reduce((x,d)=>x+num(d.dieselEq),0),real=a.rec-a.fuel-a.exp,first=firstDate();
 return `<h3 style="margin:6px 0 4px">📊 ملخص عام — ${esc(S.ev.model)}</h3><div class="muted" style="margin-bottom:8px">${first?'من '+fd(first)+' حتى اليوم':'ماكاين حتى نهار مسجل'}</div><div class="card">

 <h3 style="margin:14px 0 10px">🎯 نقطة التعادل</h3><div class="card"><div class="row"><span>الثمن الصافي ديال الطوموبيل</span><b>${money(T.net)}</b></div><div class="row"><span>التوفير لي تجمع</span><b>${money(a.save)}</b></div>

 <div class="muted">ℹ️ «التوفير من المازوط» رقم للمقارنة فقط (شحال كنتي غادي تخسر لو شريتي طاكسي ديزل)، ماشي فلوس دخلات.</div>`}
function batRows(){const f=firstDate();if(!f)return [];const s=pd(f),rows=[];for(let i=0;i<10;i++){const a=iso(new Date(s.getFullYear()+i,s.getMonth(),s.getDate())),b=iso(new Date(s.getFullYear()+i+1,s.getMonth(),s.getDate()));if(a>todayIso())break;const ds=S.days.filter(d=>d.ev&&d.date>=a&&d.date<b),k=ds.reduce((x,d)=>x+num(d.km),0),e=ds.reduce((x,d)=>x+num(d.kwh)+num(d.fkwh),0);rows.push({i:i+1,k,c:k?e/k*100:0})}return rows}

function chargePlan(){const B=num(S.ev.battery)||39.4,c=evCons(),soc=num(S.charge.soc),kmP=num(S.charge.km)||avgKm(),

 fast=20+needPct>100;let target=Math.min(100,Math.ceil(20+needPct));if(cal||fast)target=100;
 const add=Math.max(0,(target-soc)/100*B),cost=add*num(S.ev.tariff),hrs=add/6.6,
 fastKwh=fast?Math.max(0,(needPct-80)/100*B):0,fastMin=fastKwh?Math.round(fastKwh/(0.5*B)*25):0;
 const fw=fastWeek(),freeLeft=num(S.ev.fastMax)-fw,useFree=num(S.ev.freeFast)===1&&freeLeft>0&&!cal;
 return{B,cons:c,soc,kmP,need,needPct,cal,fast,target,add,cost,hrs,fastKwh,fastMin,fw,freeLeft,useFree,done:S.charge.done===todayIso()}}

function driversReport(y){const ms=monthsRange().filter(m=>m.startsWith(y)&&m<=ymOf(todayIso())),T=agg(ms),names=driverNames(T);
 return `<h3 style="margin:6px 0 10px">ملخص السائقين — ${y}</h3><div class="muted" style="margin-bottom:6px">الباقي للسائق (عدد أيام الخدمة)</div><div class="tbl"><table><tr><th>الشهر</th>${names.map(n=>`<th>${esc(n)}</th>`).join('')}</tr>${ms.map(m=>{const a=agg([m]);return `<tr><td>${fym(m)}</td>${names.map(n=>`<td>${fmtN(a.baqi[n]||0)} <span class="muted">(${a.work[n]||0})</span></td>`).join('')}</tr>`}).join('')}<tr class="tot"><td>المجموع</td>${names.map(n=>`<td>${fmtN(T.baqi[n]||0)} (${T.work[n]||0})</td>`).join('')}</tr></table></div>
 <div class="tbl"><table><tr><th>السائق</th><th>الروسيطة لي خلص</th><th>أيام الخدمة</th></tr>${names.map(n=>`<tr><td>${esc(n)}</td><td>${fmtN(T.rosBy[n]||0)}</td><td>${T.work[n]||0}</td></tr>`).join('')}</table></div>`}
function vRep(){const ys=[...new Set(monthsRange().map(m=>m.slice(0,4)))].reverse(),t=UI.rt;UI.ap=UI.ap||'all';
 let h=`<div class="seg">${[['m','شهري'],['y','سنوي'],['d','السائقين'],['a','تحليل'],['g','عام']].map(x=>`<button class="${t===x[0]?'on':''}" onclick="UI.rt='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`;
 h+=t==='g'?'':t==='m'?`<select onchange="UI.rm=this.value;render()">${monthOpts(UI.rm)}</select>`:t==='a'?`<select onchange="UI.ap=this.value;render()">${periodOpts(UI.ap)}</select>`:`<select onchange="UI.ry=this.value;render()">${ys.map(y=>`<option ${y===UI.ry?'selected':''}>${y}</option>`).join('')}</select>`;
 h+=`<div id="rep" style="margin-top:10px">${t==='g'?generalReport():t==='m'?monthReport(UI.rm):t==='y'?yearReport(UI.ry):t==='a'?analysis(UI.ap):driversReport(UI.ry)}</div><button class="btn dark" onclick="printRep()">🖨️ طبع / PDF</button>`;
 return h}
function analysis(p){const ms=periodMonths(p),a=agg(ms),M=S.maint,yr=ms.length/12,insv=num(M.insCost)*yr,vtv=num(M.vtCost)*yr,real=a.ros-a.loss-a.fixed-insv-vtv,set=new Set(ms),ds=S.days.filter(d=>set.has(ymOf(d.date))),med=consMed();
 let h=`<h3 style="margin:6px 0 10px">💎 الربح الحقيقي</h3><div class="card"><div class="row"><span>مجموع الروسيطات</span><b>${money(a.ros)}</b></div><div class="row"><span>− الخسائر والإصلاحات</span><b class="neg">${money(a.loss)}</b></div><div class="row"><span>− مصاريف ثابتة وأقساط</span><b class="neg">${money(a.fixed)}</b></div><div class="row"><span>− التأمين (${ms.length} شهر)</span><b class="neg">${money(insv)}</b></div><div class="row"><span>− الفيزيت (${ms.length} شهر)</span><b class="neg">${money(vtv)}</b></div>
 <div class="row"><span><b>= الربح الحقيقي</b></span><b class="${real<0?'neg':'pos'}" style="font-size:18px">${money(real)}</b></div><div class="row"><span>المتوسط فالشهر</span><b>${money(ms.length?real/ms.length:0)}</b></div></div>
 ${!num(M.insCost)||!num(M.vtCost)?'<div class="muted noprint" style="margin:-4px 2px 10px">💡 دخل ثمن التأمين والفيزيت فالعام فصفحة الصيانة باش يتحسبو هنا.</div>':''}`;
 const pk=v=>a.km?money(v/a.km):'—';
 if(S.ev.on)h+=batteryHtml();
 h+=`<h3 style="margin:14px 0 10px">🛣️ لكل كيلومتر</h3><div class="card"><div class="row"><span>السومة لكل كم</span><b>${pk(a.rec)}</b></div><div class="row"><span>${S.ev.on?'الطاقة':'المازوط'} لكل كم</span><b>${pk(a.fuel)}</b></div><div class="row"><span>الروسيطة لكل كم</span><b>${pk(a.ros)}</b></div><div class="row"><span>الباقي للسائق لكل كم</span><b>${pk(a.baqiT)}</b></div></div>`;
 const W=[1,2,3,4,5,6,0].map(i=>{const x=ds.filter(d=>pd(d.date).getDay()===i&&isWork(d.s1)&&num(d.rec)>0),n=x.length;return{i,n,rec:n?x.reduce((s,d)=>s+num(d.rec),0)/n:0,baqi:n?x.reduce((s,d)=>s+calc(d).baqi,0)/n:0,km:n?x.reduce((s,d)=>s+num(d.km),0)/n:0}}),best=Math.max(...W.map(w=>w.rec));
 h+=`<h3 style="margin:14px 0 10px">📆 شمن نهار كيجيب أكثر؟</h3><div class="tbl"><table><tr><th>النهار</th><th>الأيام</th><th>متوسط السومة</th><th>متوسط الباقي</th><th>متوسط كم</th></tr>${W.map(w=>`<tr class="${w.n&&w.rec===best?'tot':''}"><td>${w.n&&w.rec===best?'⭐ ':''}${DAYS[w.i]}</td><td>${w.n}</td><td>${fmtN(w.rec)}</td><td>${fmtN(w.baqi)}</td><td>${Math.round(w.km)}</td></tr>`).join('')}</table></div>`;
 const odd=ds.filter(d=>fuelOdd(d,med));
 h+=`<h3 style="margin:14px 0 10px">⛽ أيام المازوط فيها غريب</h3><div class="card">${med?`<div class="muted">الاستهلاك العادي: <span class="num">${med.toFixed(2)}</span> L/100 — كينبهك إلا فات <span class="num">${(med*1.25).toFixed(2)}</span></div>`:''}${odd.length?odd.map(d=>`<div class="row"><span>${DAYS[pd(d.date).getDay()]} ${fd(d.date)}</span><b class="neg"><span class="num">${num(d.cons).toFixed(2)} L/100</span></b></div>`).join(''):'<div class="row"><span>✅ ماكاين حتى نهار غريب</span></div>'}</div>`;
 return h}
function printRep(){const s=S.settings;$('#pw').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #f2a900;padding-bottom:8px;margin-bottom:10px"><div><b style="font-size:18px">${esc(s.name)}</b><br><span>${esc(s.plate)}</span></div>${s.logo?`<img class="logo" src="${s.logo}">`:'<span style="font-size:34px">🚕</span>'}</div>`+$('#rep').innerHTML+`<div style="margin-top:14px;font-size:10px;color:#6b7684">تاريخ الطبع: ${fd(todayIso())}</div>`;setTimeout(()=>window.print(),80)}
// ---------- settings ----------
function setS(k,v,n){S.settings[k]=n?num(v):v;save();render();toast('تحفظ ✅')}
function vSet(){const s=S.settings;
 return `<div class="sec">🚕 معلومات الطاكسي</div><div class="card"><label>السمية</label><input value="${esc(s.name)}" onchange="setS('name',this.value)"><label>رقم اللوحة / الرخصة</label><input value="${esc(s.plate)}" onchange="setS('plate',this.value)">
 <label>اللوغو (كيبان فالـ PDF)</label>${s.logo?`<img class="logo" src="${s.logo}" style="display:block;margin-bottom:6px">`:''}<input type="file" accept="image/*" onchange="setLogo(this)">${s.logo?`<button class="btn sm red" style="margin-top:6px" onclick="setS('logo','')">مسح اللوغو</button>`:''}</div>
 <div class="sec">👤 السائقين</div><div class="card">${s.drivers.map((d,i)=>`<div class="row"><span>${esc(d)}</span><button class="btn sm red" onclick="delDriver(${i})">✕</button></div>`).join('')}<div style="display:flex;gap:8px;margin-top:8px"><input id="nd" placeholder="سمية السائق"><button class="btn sm" onclick="addDriver()">زيد</button></div></div>
 <div class="sec">💰 أنواع الدوام والروسيطة</div><div class="card">${s.shifts.map((x,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px"><input value="${esc(x.n)}" onchange="setShift(${i},'n',this.value)"><input style="width:110px" inputmode="decimal" value="${x.r}" onchange="setShift(${i},'r',this.value)"><button class="btn sm red" onclick="delShift(${i})">✕</button></div>`).join('')}<button class="btn ghost" onclick="addShift()">＋ زيد نوع دوام</button><div class="muted" style="margin-top:8px">تبديل الثمن هنا كيأثر غير على الأيام الجاية، القدام كيبقاو بحالهم.</div></div>
 ${evSettings()}
 <div class="sec">🔒 الكود</div><div class="card"><div class="row"><span>${s.pin?'الكود مفعّل ✅':'ماكاينش كود'}</span><span><button class="btn sm" onclick="setPin()">${s.pin?'بدل الكود':'دير كود'}</button> ${s.pin?`<button class="btn sm red" onclick="if(confirm('نحيدو الكود؟'))setS('pin','')">حيد</button>`:''}</span></div></div>
 <div class="sec">💾 النسخة الاحتياطية</div><div class="card"><div class="muted">آخر نسخة: ${S.lastBackup?fd(S.lastBackup):'ماعمرك درتي'}. المعلومات كاينة غير فهاد التيليفون، دير نسخة كل سيمانة وحطها فـ Fichiers ولا iCloud.</div>
 <button class="btn dark" onclick="exportJSON()">⬇️ دير نسخة احتياطية (JSON)</button><label class="btn ghost" style="text-align:center;margin-top:10px;color:var(--ink);font-size:16px">⬆️ رجع من نسخة<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this)"></label>
 <button class="btn red" onclick="resetAll()">مسح كلشي</button></div><div class="muted" style="text-align:center;margin:14px 0">GEELY EX2 · v1.0</div>`}
function addDriver(){const n=$('#nd').value.trim();if(!n)return;if(!S.settings.drivers.includes(n))S.settings.drivers.push(n);save();render()}
function delDriver(i){if(!confirm('نحيدو '+S.settings.drivers[i]+' من اللائحة؟ (الأيام القدام كيبقاو)'))return;S.settings.drivers.splice(i,1);save();render()}
function setShift(i,k,v){S.settings.shifts[i][k]=k==='r'?num(v):v.trim();save();toast('تحفظ ✅')}
function addShift(){S.settings.shifts.push({n:'دوام جديد',r:0});save();render()}
function delShift(i){if(!confirm('نمسحو هاد النوع؟'))return;S.settings.shifts.splice(i,1);save();render()}
function setLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,300/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);setS('logo',c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(f)}
function setPin(){const p=prompt('كتب كود جديد (4 أرقام)');if(p===null)return;if(!/^\d{4}$/.test(p))return alert('خاص الكود يكون 4 أرقام');if(prompt('عاود كتب الكود')!==p)return alert('الكود ماشي بحال بحال');setS('pin',p)}
function exportJSON(){const name='byd-backup-'+todayIso()+'.json',blob=new Blob([JSON.stringify(S)],{type:'application/json'}),done=()=>{S.lastBackup=todayIso();save();render();toast('النسخة واجدة ✅')};
 try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(done).catch(()=>{});return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();done()}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.days))throw 0;if(!confirm('غادي نبدلو المعلومات لي كاينة دابا بالنسخة ('+o.days.length+' نهار). نكملو؟'))return;S=norm(o);save();UI.tab='dash';render();toast('رجعات النسخة ✅')}catch(e){alert('هاد الملف ماشي نسخة ديال التطبيق')}};r.readAsText(f)}
function resetAll(){if(!confirm('غادي يتمسح كلشي! دير نسخة احتياطية قبل. نكملو؟'))return;if(prompt('كتب: مسح')!=='مسح')return;S=defaults();save();UI.tab='dash';render();toast('تمسح كلشي')}
// ---------- lock ----------
let buf='',hiddenAt=0;
function lock(){if(!S.settings.pin)return;buf='';$('#lock').style.display='flex';drawDots();$('#pad').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?`<button onclick="press('${k}')">${k}</button>`:'<span></span>').join('')}
function drawDots(){$('#dots').innerHTML=[0,1,2,3].map(i=>`<span class="${i<buf.length?'f':''}"></span>`).join('')}
function press(k){if(k==='⌫')buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;drawDots();if(buf.length===4){if(buf===S.settings.pin){$('#lock').style.display='none'}else{buf='';setTimeout(drawDots,250);if(navigator.vibrate)navigator.vibrate(200)}}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(S&&hiddenAt&&Date.now()-hiddenAt>60000){lock();render()}});
boot();
</script>
</body>
</html>
